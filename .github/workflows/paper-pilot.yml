# Every trading day after the US close, fly one full pass of the rules
# over the owner's PAPER account: trail stops, exit broken trends, take
# at most one new cash-limited entry with its stop attached (GTC).
# Orders placed after hours execute at the next open — the normal rhythm
# of a daily-bar system. When the pass does anything (or fails), it
# opens an issue so the owner gets an email; quiet days stay quiet.
#
# PAPER ONLY: the autopilot command has no live mode, by construction.
# Scheduled workflows only run from the default branch (main).
name: Paper autopilot

on:
  schedule:
    - cron: "30 21 * * 1-5" # Mon-Fri 21:30 UTC — after the US close, year-round
  workflow_dispatch: {} # and on demand, via the Actions tab

permissions:
  issues: write
  contents: write # so the pass can write its own row into the paper log

jobs:
  fly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the daily pass
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          set -o pipefail
          python -m trendkept.cli autopilot --risk 0.01 --confirm \
            | tee /tmp/pass.txt

      # The log is the public evidence file, so every pass records itself —
      # including quiet ones. Idempotent per date: a re-run adds nothing.
      # A failure here must never mask the trading result, so it is tolerated.
      - name: Log the pass to the paper log
        if: always()
        continue-on-error: true
        run: |
          if [ ! -s /tmp/pass.txt ]; then
            echo "No pass output — nothing to log."
            exit 0
          fi
          python -m trendkept.paper_log \
            --pass-file /tmp/pass.txt \
            --log business/paper_log.csv
          if git diff --quiet -- business/paper_log.csv; then
            echo "Paper log already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/paper_log.csv
          git commit -m "Paper log: autopilot pass $(date -u +%Y-%m-%d)"
          # Another run may have landed first; rebase rather than clobber.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Paper log updated."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done
          echo "::warning::Could not push the paper log row; the pass itself is unaffected."

      - name: Report when something happened
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/pass.txt ]; then
            echo "The autopilot pass failed before producing output." > /tmp/pass.txt
          fi
          if grep -qE "submitted|EXIT|RAISE STOP|SET STOP|UNPROTECTED|failed|error" /tmp/pass.txt; then
            {
              echo "The rules acted on the paper account today. Full pass:"
              echo
              echo '```'
              cat /tmp/pass.txt
              echo '```'
              echo
              echo "_Paper only. Review the positions and the log row._"
            } > /tmp/issue.md
            gh issue create \
              --title "Paper autopilot — $(date -u +%Y-%m-%d)" \
              --body-file /tmp/issue.md \
              --repo "$GITHUB_REPOSITORY"
          else
            echo "Quiet pass — no issue opened."
          fi
